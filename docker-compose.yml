services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: solarlab-server:dev
    environment:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      NEWCORE_EQUATIONS: "assembled"
      PYTHONUNBUFFERED: "1"
    volumes:
      - solarlab_runtime:/var/lib/solarlab
    ports:
      - "8000:8000"
    command:
      - /app/.venv/bin/python
      - -m
      - solarlab_server.cli
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --store-dir
      - /var/lib/solarlab/store
      - --work-dir
      - /var/lib/solarlab/work

  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: solarlab-frontend:dev
    environment:
      VITE_SOLARLAB_SERVER: http://backend:8000
    volumes:
      - ./web:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0

  notebook:
    profiles:
      - notebook
    build:
      context: .
      dockerfile: Dockerfile
    image: solarlab-server:dev
    environment:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      NEWCORE_EQUATIONS: "assembled"
      PYTHONUNBUFFERED: "1"
    ports:
      - "8888:8888"
    command:
      - /app/.venv/bin/python
      - -m
      - jupyterlab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --allow-root
      - --ServerApp.token=solarlab

volumes:
  solarlab_runtime:
  frontend_node_modules:

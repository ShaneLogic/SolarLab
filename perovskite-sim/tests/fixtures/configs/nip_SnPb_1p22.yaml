# nip_SnPb_1p22.yaml — narrow-gap Sn-Pb perovskite sub-cell preset (1.22 eV)
#
# TANDEM SUB-CELL PRESET — do not use standalone without re-tuning contacts.
# This preset represents the bottom junction of a Lin 2019-style all-perovskite
# two-terminal tandem (Eg_top ≈ 1.77 eV FA-Cs / Eg_bot ≈ 1.22 eV Sn-Pb).
# The tandem loader in Task 6+ will stitch this with nip_wideGap_FACs_1p77.yaml.
#
# The optical layer order follows Lin 2019. PEDOT:PSS thickness is not reported
# in the article Methods; 20 nm below is an explicit modelling assumption.
# Electrical contact parameters remain transport-model priors, so this preset
# remains a partial external comparison rather than a predictive reproduction.
#
# References:
#   Hao et al. Nature Photon. 2014 (Sn-Pb chi / Eg)
#   Lin et al. Nature 2019 (tandem architecture, absorber thicknesses)
device:
  V_bi: 1.1
  Phi: 2.5e21
# Layer order: HTL (left / hole-contact) → absorber → ETL (right / electron-contact)
layers:
  - name: PEDOT_PSS
    role: HTL
    thickness: 20e-9
    eps_r: 3.0
    mu_n: 1e-10
    mu_p: 1e-6
    ni: 1e0
    N_D: 0.0
    N_A: 2e23
    D_ion: 0.0
    P_lim: 1e30
    P0: 0.0
    tau_n: 1e-9
    tau_p: 1e-9
    n1: 1e0
    p1: 1e0
    B_rad: 1e-30
    C_n: 1e-42
    C_p: 1e-42
    alpha: 0.0
    optical_material: PEDOT_PSS

  - name: SnPb_1p22
    role: absorber
    # Lin 2019 reports an approximately 800 nm narrow-gap back absorber.
    # Keep the paper thickness even though the placeholder optical stack is
    # not yet current-matched; do not tune this field to hide that gap.
    thickness: 800e-9
    eps_r: 24.1                 # TODO(benchmark): refine after Lin 2019 SI data is loaded
    mu_n: 2e-4                  # TODO(benchmark): refine after Lin 2019 SI data is loaded
    mu_p: 2e-4                  # TODO(benchmark): refine after Lin 2019 SI data is loaded
    ni: 3.2e13                  # TODO(benchmark): refine after Lin 2019 SI data is loaded
    N_D: 0.0
    N_A: 0.0
    D_ion: 1e-16                # TODO(benchmark): refine after Lin 2019 SI data is loaded
    P_lim: 1.6e27               # TODO(benchmark): refine after Lin 2019 SI data is loaded
    P0: 1.6e24                  # TODO(benchmark): refine after Lin 2019 SI data is loaded
    tau_n: 1e-6                 # TODO(benchmark): refine after Lin 2019 SI data is loaded
    tau_p: 1e-6                 # TODO(benchmark): refine after Lin 2019 SI data is loaded
    n1: 3.2e13                  # TODO(benchmark): refine after Lin 2019 SI data is loaded
    p1: 3.2e13                  # TODO(benchmark): refine after Lin 2019 SI data is loaded
    B_rad: 5e-22                # TODO(benchmark): refine after Lin 2019 SI data is loaded
    C_n: 1e-42
    C_p: 1e-42
    alpha: 1.3e7                # TODO(benchmark): refine after Lin 2019 SI data is loaded
    # NOTE: Eg/chi intentionally left at 0 (default). See the long comment in
    # nip_wideGap_FACs_1p77.yaml: this is a TANDEM SUB-CELL ONLY, Lin 2019 is
    # tuned around manual V_bi=1.10 V, and compute_V_bi() falls back to the
    # manual value when chi=Eg=0 in all electrical layers. Stage 1c migration
    # was deferred — see top-cell preset for the full rationale.
    optical_material: SnPb_1p22

  - name: C60
    role: ETL
    # Source-reported thickness in the Lin tandem Methods.
    thickness: 20e-9
    eps_r: 10.0
    mu_n: 1e-5
    mu_p: 1e-10
    ni: 1e0
    N_D: 1e24
    N_A: 0.0
    D_ion: 0.0
    P_lim: 1e30
    P0: 0.0
    tau_n: 1e-9
    tau_p: 1e-9
    n1: 1e0
    p1: 1e0
    B_rad: 1e-30
    C_n: 1e-42
    C_p: 1e-42
    alpha: 0.0
    optical_material: C60

  - name: BCP
    role: ETL
    # Source-reported thickness. A transparent n=1.7 optical approximation is
    # explicit because no traceable BCP n,k table is frozen in this repository.
    thickness: 7e-9
    eps_r: 3.0
    mu_n: 1e-5
    mu_p: 1e-10
    ni: 1e0
    N_D: 1e24
    N_A: 0.0
    D_ion: 0.0
    P_lim: 1e30
    P0: 0.0
    tau_n: 1e-9
    tau_p: 1e-9
    n1: 1e0
    p1: 1e0
    B_rad: 1e-30
    C_n: 1e-42
    C_p: 1e-42
    alpha: 0.0
    n_optical: 1.7

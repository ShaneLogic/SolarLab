# Lin et al., Nature Energy 4, 864-873 (2019)
# https://www.nature.com/articles/s41560-019-0466-3
# Monolithic all-perovskite 2T tandem. The benchmark tuple below is the
# reported 0.073 cm^2 reverse-scan champion (1.965 V, 15.6 mA/cm^2, 81.0% FF,
# 24.8% PCE). The paper separately reports a certified 24.8% result at a
# 0.049 cm^2 aperture; do not combine that area with this target tuple.
#
# Sub-cell YAMLs are loaded relative to this file's directory.
# Junction stack is the recombination layer between top and bottom sub-cells.
# v1 only supports junction.model = ideal_ohmic.
schema_version: 1
device_type: tandem_2T_monolithic

tandem:
  top_cell: nip_wideGap_FACs_1p77.yaml
  bottom_cell: nip_SnPb_1p22.yaml
  junction:
    model: ideal_ohmic
  light_direction: top_first

junction_stack:
  - name: ALD_SnO2
    thickness_nm: 20.0
    optical_material: SnO2
    incoherent: false
  - name: Au_nanoparticles
    thickness_nm: 1.0
    optical_material: Au
    incoherent: false

# Optical-only back contact. Lin 2019 reports 100 nm Cu; this preset now uses
# the native Johnson-Christy Cu table instead of the previous Ag surrogate.
back_reflector:
  name: Cu_back_contact
  thickness_nm: 100.0
  optical_material: Cu
  incoherent: false

benchmark:
  reference: lin2019_nature_energy
  target_pce: 24.8
  target_jsc_ma_cm2: 15.6
  target_voc_v: 1.965
  target_ff: 0.81
  tolerance_pct: 10.0

# Symmetric silicon p/n homojunction for the restricted P4.2 combined
# incomplete-ionization and Slotboom band-gap-narrowing certificate. This is
# an internal constitutive benchmark, not a calibrated device fit.

simulation_hints:
  min_N_grid: 40
  notes: >-
    Use only the registered incomplete-ionization-bgn-temperature-equilibrium-v1
    lane. The research path is dark, ohmic, ion-free, homojunction-only, and
    disables bulk recombination. The Slotboom coefficients are the common
    silicon E_ref=9 meV, N_ref=1e23 m^-3, shape=0.5 parameterization with equal
    conduction/valence edge partition. It does not model impurity bands, the
    Mott transition, or dopant capture kinetics.

device:
  mode: full
  T: 300.0
  built_in_potential_mode: semiconductor_work_function
  Phi: 0.0
  interfaces:
    - [0.0, 0.0]

layers:
  - name: p_discrete_bgn
    role: absorber
    thickness: 100.0e-9
    eps_r: 11.7
    mu_n: 0.135
    mu_p: 0.048
    ni: 1.0e16
    N_A: 3.0e23
    N_D: 0.0
    D_ion: 0.0
    P_lim: 1.0e30
    P0: 0.0
    tau_n: 1.0e-6
    tau_p: 1.0e-6
    n1: 1.0e16
    p1: 1.0e16
    B_rad: 0.0
    C_n: 0.0
    C_p: 0.0
    alpha: 0.0
    chi: 4.05
    Eg: 1.124
    Nc300: 2.8e25
    Nv300: 1.04e25
    carrier_statistics: fermi_dirac
    dopant_ionization_model: discrete_level
    acceptor_binding_energy_eV: 0.045
    acceptor_degeneracy: 4.0
    band_gap_narrowing_model: slotboom
    bgn_reference_energy_eV: 0.009
    bgn_reference_density_m3: 1.0e23
    bgn_log_shape: 0.5
    bgn_conduction_band_fraction: 0.5
    varshni_alpha: 4.73e-4
    varshni_beta: 636.0

  - name: n_discrete_bgn
    role: absorber
    thickness: 100.0e-9
    eps_r: 11.7
    mu_n: 0.135
    mu_p: 0.048
    ni: 1.0e16
    N_A: 0.0
    N_D: 3.0e23
    D_ion: 0.0
    P_lim: 1.0e30
    P0: 0.0
    tau_n: 1.0e-6
    tau_p: 1.0e-6
    n1: 1.0e16
    p1: 1.0e16
    B_rad: 0.0
    C_n: 0.0
    C_p: 0.0
    alpha: 0.0
    chi: 4.05
    Eg: 1.124
    Nc300: 2.8e25
    Nv300: 1.04e25
    carrier_statistics: fermi_dirac
    dopant_ionization_model: discrete_level
    donor_binding_energy_eV: 0.045
    donor_degeneracy: 2.0
    band_gap_narrowing_model: slotboom
    bgn_reference_energy_eV: 0.009
    bgn_reference_density_m3: 1.0e23
    bgn_log_shape: 0.5
    bgn_conduction_band_fraction: 0.5
    varshni_alpha: 4.73e-4
    varshni_beta: 636.0

# Symmetric high-doping silicon p+/n+ homojunction for the restricted P4.2
# Fermi-Dirac transport certificate. This is an internal analytic/numerical
# benchmark, not an external-device fit.

simulation_hints:
  min_N_grid: 40
  notes: >-
    Use only the registered degenerate-pn-equilibrium-v1 lane. The research
    path is dark, ohmic, ion-free, interface-recombination-free, and disables
    bulk recombination until a Fermi-Dirac detailed-balance law is introduced.

device:
  mode: full
  T: 300.0
  built_in_potential_mode: semiconductor_work_function
  Phi: 0.0
  interfaces:
    - [0.0, 0.0]

layers:
  - name: p_plus
    role: absorber
    thickness: 100.0e-9
    eps_r: 11.7
    mu_n: 0.135
    mu_p: 0.048
    ni: 1.0e16
    N_A: 3.0e25
    N_D: 0.0
    D_ion: 0.0
    P_lim: 1.0e30
    P0: 0.0
    tau_n: 1.0e-6
    tau_p: 1.0e-6
    n1: 1.0e16
    p1: 1.0e16
    B_rad: 0.0
    C_n: 0.0
    C_p: 0.0
    alpha: 0.0
    chi: 4.05
    Eg: 1.124
    Nc300: 2.8e25
    Nv300: 1.04e25
    carrier_statistics: fermi_dirac

  - name: n_plus
    role: absorber
    thickness: 100.0e-9
    eps_r: 11.7
    mu_n: 0.135
    mu_p: 0.048
    ni: 1.0e16
    N_A: 0.0
    N_D: 3.0e25
    D_ion: 0.0
    P_lim: 1.0e30
    P0: 0.0
    tau_n: 1.0e-6
    tau_p: 1.0e-6
    n1: 1.0e16
    p1: 1.0e16
    B_rad: 0.0
    C_n: 0.0
    C_p: 0.0
    alpha: 0.0
    chi: 4.05
    Eg: 1.124
    Nc300: 2.8e25
    Nv300: 1.04e25
    carrier_statistics: fermi_dirac

schema_version: standard-device-v1

device:
  phi_left: 0.0
  built_in_potential_mode: semiconductor_work_function
  Phi: 2.0e21
  mode: full
  T: 300.0
  band_grading: true

layers:
  - name: p_graded_defects
    role: absorber
    thickness: 3.0e-7
    eps_r: 20.0
    mu_n: 2.0e-3
    mu_p: 2.0e-3
    D_ion: 0.0
    P_lim: 1.0e30
    P0: 0.0
    ni: 7.867840262325242e16
    tau_n: 1.0e-6
    tau_p: 1.0e-6
    n1: 7.867840262325242e16
    p1: 7.867840262325242e16
    B_rad: 0.0
    C_n: 0.0
    C_p: 0.0
    alpha: 4.0e5
    N_A: 5.0e21
    N_D: 0.0
    chi: 4.04
    chi_back: 4.0
    Eg: 0.84
    Eg_back: 0.8
    Nc300: 1.0e24
    Nv300: 8.0e23
    defect_schema_version: solarlab-explicit-bulk-defects-v3
    defect_model: explicit_quasi_steady
    bulk_defects:
      - name: p_vb_tail_donor
        distribution:
          kind: valence_band_tail
          normalization: integrated_total
          total_density_m3: 6.0e20
          center_eV_above_vb: 0.05
          energy_reference: above_valence_band
          width_eV: 0.05
          width_convention: scaps_characteristic_energy
          support_width_multiplier: 6.0
        spatial_profile:
          coordinate: normalized_layer_coordinate
          interpolation: piecewise_linear
          density_normalization: layer_average_unity
          knots:
            - {position_fraction: 0.0, density_multiplier: 0.6}
            - {position_fraction: 0.5, density_multiplier: 1.0}
            - {position_fraction: 1.0, density_multiplier: 1.4}
        charge_transition: donor
        neutral_reference: filled
        kinetics:
          sigma_n_m2: 2.0e-19
          sigma_p_m2: 7.0e-20
          thermal_velocity_n_m_s: 1.0e5
          thermal_velocity_p_m_s: 8.0e4
        degeneracy: 1.0
      - name: p_uniform_neutral
        distribution:
          kind: uniform
          normalization: integrated_total
          total_density_m3: 3.0e20
          center_eV_above_vb: 0.39
          energy_reference: above_valence_band
          width_eV: 0.3
          width_convention: uniform_full_width
        charge_transition: neutral
        neutral_reference: all_occupancies
        kinetics:
          sigma_n_m2: 1.0e-19
          sigma_p_m2: 1.0e-19
          thermal_velocity_n_m_s: 1.0e5
          thermal_velocity_p_m_s: 8.0e4
        degeneracy: 1.0

  - name: n_graded_defects
    role: ETL
    thickness: 3.0e-7
    eps_r: 20.0
    mu_n: 2.0e-3
    mu_p: 2.0e-3
    D_ion: 0.0
    P_lim: 1.0e30
    P0: 0.0
    ni: 1.7054568918001667e17
    tau_n: 1.0e-6
    tau_p: 1.0e-6
    n1: 1.7054568918001667e17
    p1: 1.7054568918001667e17
    B_rad: 0.0
    C_n: 0.0
    C_p: 0.0
    alpha: 0.0
    N_A: 0.0
    N_D: 5.0e21
    chi: 4.0
    chi_back: 4.04
    Eg: 0.8
    Eg_back: 0.84
    Nc300: 1.0e24
    Nv300: 8.0e23
    defect_schema_version: solarlab-explicit-bulk-defects-v3
    defect_model: explicit_quasi_steady
    bulk_defects:
      - name: n_gaussian_acceptor
        distribution:
          kind: gaussian
          normalization: integrated_total
          total_density_m3: 8.0e20
          center_eV_above_vb: 0.39
          energy_reference: above_valence_band
          width_eV: 0.05
          width_convention: gaussian_standard_deviation
          support_width_multiplier: 6.0
        spatial_profile:
          coordinate: normalized_layer_coordinate
          interpolation: piecewise_linear
          density_normalization: layer_average_unity
          knots:
            - {position_fraction: 0.0, density_multiplier: 1.4}
            - {position_fraction: 0.5, density_multiplier: 1.0}
            - {position_fraction: 1.0, density_multiplier: 0.6}
        charge_transition: acceptor
        neutral_reference: empty
        kinetics:
          sigma_n_m2: 2.0e-19
          sigma_p_m2: 7.0e-20
          thermal_velocity_n_m_s: 1.0e5
          thermal_velocity_p_m_s: 8.0e4
        degeneracy: 1.0
      - name: n_cb_tail_neutral
        distribution:
          kind: conduction_band_tail
          normalization: integrated_total
          total_density_m3: 3.0e20
          center_eV_above_vb: 0.75
          energy_reference: above_valence_band
          width_eV: 0.05
          width_convention: scaps_characteristic_energy
          support_width_multiplier: 6.0
        spatial_profile:
          coordinate: normalized_layer_coordinate
          interpolation: piecewise_linear
          density_normalization: layer_average_unity
          knots:
            - {position_fraction: 0.0, density_multiplier: 0.8}
            - {position_fraction: 1.0, density_multiplier: 1.2}
        charge_transition: neutral
        neutral_reference: all_occupancies
        kinetics:
          sigma_n_m2: 1.0e-19
          sigma_p_m2: 1.0e-19
          thermal_velocity_n_m_s: 1.0e5
          thermal_velocity_p_m_s: 8.0e4
        degeneracy: 1.0

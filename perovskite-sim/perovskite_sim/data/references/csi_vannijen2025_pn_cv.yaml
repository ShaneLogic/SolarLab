limitations:
  - The source data are independent numerical TCAD results, not measurements.
  - The source is 2-D with partial-width contacts; SolarLab's benchmark is 1-D.
  - The exact proprietary Sentaurus input deck is not included in the dataset.
  - Paper-unspecified Sentaurus physics settings cannot be matched exactly.
  - SolarLab truncates the negligible Gaussian tail at 15 um to form its mesh subdomains.
  - The source uses infinitesimal AC linearization, while SolarLab records a 10 mV nominal reporting amplitude for its linear operator.
  - No pointwise uncertainty or experimental error bars are available.

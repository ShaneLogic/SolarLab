schema_version: standard-device-v1

# D7-E2 multivalent reference scenario M1: a SCAPS double donor (+2/+1/0)
# in a p-type slab, where the defect compensates the acceptor doping. The
# binomial state degeneracies are the SCAPS convention for a three-state
# centre, so this scenario also carries the degeneracy ratio through contact
# neutrality and the QF/DC closure.
device:
  phi_left: 0.0
  built_in_potential_mode: semiconductor_work_function
  Phi: 2.0e16
  mode: full
  T: 300.0

layers:
  - name: m1_double_donor_p_slab
    role: absorber
    thickness: 3.0e-7
    eps_r: 20.0
    mu_n: 2.0e-3
    mu_p: 2.0e-3
    D_ion: 0.0
    P_lim: 1.0e30
    P0: 0.0
    ni: 1.7054568918001667e17
    tau_n: 2.5e-8
    tau_p: 8.928571428571429e-8
    n1: 1.2950995328045926e17
    p1: 2.2458375870849334e17
    B_rad: 0.0
    C_n: 0.0
    C_p: 0.0
    alpha: 4.0e5
    N_A: 5.0e21
    N_D: 0.0
    chi: 4.0
    Eg: 0.8
    Nc300: 1.0e24
    Nv300: 8.0e23
    defect_schema_version: solarlab-explicit-bulk-defects-v4
    defect_model: explicit_quasi_steady
    bulk_defects:
      - name: m1_double_donor
        total_density_m3: 2.0e21
        configuration:
          family: double_donor
          charge_states_e: [2, 1, 0]
          degeneracy_convention: scaps_binomial
          state_degeneracies: [1.0, 2.0, 1.0]
          energy_levels:
            first_transition_eV_above_vb: 0.30
            correlation_energies_eV: [0.15]
            energy_reference: above_valence_band
          transition_kinetics:
            - sigma_n_m2: 2.0e-19
              sigma_p_m2: 7.0e-20
              thermal_velocity_n_m_s: 1.0e5
              thermal_velocity_p_m_s: 8.0e4
            - sigma_n_m2: 1.0e-19
              sigma_p_m2: 5.0e-20
              thermal_velocity_n_m_s: 1.0e5
              thermal_velocity_p_m_s: 8.0e4

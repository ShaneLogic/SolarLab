# Uncalibrated D4-E3 reference for the public charged-interface J-V slice.
#
# This is the photovoltaic companion of interface_charge_research.yaml. The
# sole physical difference is n-type ETL doping, which supplies a certified
# Voc bracket for the frozen N=30, 0--0.1 V protocol. It is a synthetic
# internal numerical reference, not a fitted device, SCAPS parity case, or
# experimental performance claim.
device:
  built_in_potential_mode: semiconductor_work_function
  interface_charge_closure: equilibrium_referenced
  interface_charge_rebaseline_acknowledged: true
  Phi: 1.0e18
  mode: full
  interface_defects:
    - sigma_n_cm2: 3.0e-20
      sigma_p_cm2: 5.0e-20
      v_th_cm_s: 1.0e7
      N_t_cm2: 1.0e13
      E_t_eV_below_cb: 0.55

electrical_grid:
  interval_weights:
    charge_absorber: 1.0
    charge_etl: 1.0
  alphas:
    charge_absorber: 2.0
    charge_etl: 3.0

layers:
  - name: charge_absorber
    role: absorber
    thickness: 1.0e-7
    eps_r: 10.0
    mu_n: 1.0e-3
    mu_p: 1.0e-3
    D_ion: 0.0
    P_lim: 1.0e24
    P0: 0.0
    ni: 2.5150958270872183e12
    tau_n: 1.0e-6
    tau_p: 1.0e-6
    n1: 2.5150958270872183e12
    p1: 2.5150958270872183e12
    B_rad: 0.0
    C_n: 0.0
    C_p: 0.0
    alpha: 1.0e6
    N_A: 0.0
    N_D: 0.0
    chi: 4.0
    Eg: 1.5
    Nc300: 1.0e25
    Nv300: 1.0e25
    A_star_n: 1.2017e6
    A_star_p: 1.2017e6

  - name: charge_etl
    role: ETL
    thickness: 1.0e-7
    eps_r: 10.0
    mu_n: 1.0e-3
    mu_p: 1.0e-3
    D_ion: 0.0
    P_lim: 1.0e24
    P0: 0.0
    ni: 2.5150958270872183e12
    tau_n: 1.0e-6
    tau_p: 1.0e-6
    n1: 2.5150958270872183e12
    p1: 2.5150958270872183e12
    B_rad: 0.0
    C_n: 0.0
    C_p: 0.0
    alpha: 0.0
    N_A: 0.0
    N_D: 2.0e21
    chi: 4.1
    Eg: 1.5
    Nc300: 1.0e25
    Nv300: 1.0e25
    A_star_n: 1.2017e6
    A_star_p: 1.2017e6

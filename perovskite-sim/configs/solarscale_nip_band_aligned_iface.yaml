# SolarScale n-i-p band-aligned screening template — WITH hetero-interface
# recombination declared.
#
# Identical to solarscale_nip_band_aligned.yaml except for the
# `interface_defects` block below. That baseline declares no interface schema
# at all, which loads as `DeviceStack.interfaces == ()`: band offsets then
# reach only transport (the Scharfetter-Gummel flux and the thermionic cap) and
# never the recombination channel, so the absorber electron affinity moves FF
# but barely moves V_oc. Measured span of V_oc across chi = 3.5..4.2 eV is
# 9.2 mV on the baseline versus 294 mV here. Nothing warns you about the
# difference, so any band-alignment conclusion drawn on the baseline is
# optimistic.
#
# Use this variant for band-alignment / absorber-screening studies. It is the
# stack behind PhD/SolarCellReverseDesign Stage 2c, whose result is that the
# absorber acceptance region tracks a constant work function chi + Eg/2 rather
# than a constant conduction-band offset.
#
device:
  # Hetero-interface SRH, FULL-layer aligned: one slot per internal interface
  # of `layers`, substrate included. This stack is
  # glass / spiro_HTL / absorber / TiO2_ETL, so:
  #   [0] glass|spiro_HTL  — optical substrate boundary, no electrical defect
  #   [1] spiro_HTL|absorber
  #   [2] absorber|TiO2_ETL
  #
  # The loader derives the surface-recombination velocities from the kinetic
  # identity v = sigma * v_th * N_t: 1e-15 cm^2 * 1e7 cm/s * 1e9 cm^-2 gives
  # v_n = v_p = 0.1 m/s on both hetero-interfaces. E_t sits at mid-gap
  # (0.8 eV below the absorber CB at Eg = 1.6), the worst-case SRH centre.
  #
  # Declaring the DEFECT, not just an SRV pair, is what matters: it activates
  # the E_t-aware cross-carrier evaluation path, which carries ~95 % of the
  # effect. Measured at Eg = 1.40, chi = 3.70, tau = 1e-6 — no interfaces
  # V_oc 0.9017; bare SRV of the same magnitude 0.8949 (-6.8 mV); SRV plus
  # this defect 0.7585 (-143 mV). Do not try to compensate for a missing
  # defect by inflating the SRV; it is a different, much weaker channel.
  #
  # These numbers are a DEVICE-LEVEL calibration, not face-value physics: the
  # solver samples the cross-carrier interface SRH rate on bulk-interior nodes
  # (over-counting relative to an interface-plane evaluation) and normalises by
  # the interface dual-cell width, so the result is grid-referenced. Calibrated
  # at N_grid = 60 on this 200/400/100 nm thickness set, where it costs 87 mV
  # at the band-alignment optimum — inside the 50-150 mV interface loss typical
  # of perovskite devices. Going to N_grid = 120 shifts V_oc by -16.0 mV on the
  # cliff flank but only -0.6 mV at the optimum and -0.6 mV on the spike flank.
  # Re-calibrate if you change the grid or the layer thicknesses.
  interface_defects:
    -
    - sigma_n_cm2: 1.0e-15
      sigma_p_cm2: 1.0e-15
      v_th_cm_s: 1.0e7
      N_t_cm2: 1.0e9
      E_t_eV_below_cb: 0.8
    - sigma_n_cm2: 1.0e-15
      sigma_p_cm2: 1.0e-15
      v_th_cm_s: 1.0e7
      N_t_cm2: 1.0e9
      E_t_eV_below_cb: 0.8
  V_bi: 0.79
  Phi: 2.5e21
  mode: fast
layers:
  - name: glass
    role: substrate
    thickness: 1.0e-3
    eps_r: 2.25
    mu_n: 0.0
    mu_p: 0.0
    ni: 1.0
    N_D: 0.0
    N_A: 0.0
    D_ion: 0.0
    P_lim: 1e30
    P0: 0.0
    tau_n: 1.0e-9
    tau_p: 1.0e-9
    n1: 1.0
    p1: 1.0
    B_rad: 0.0
    C_n: 0.0
    C_p: 0.0
    alpha: 0.0
    optical_material: glass
    incoherent: true

  - name: spiro_HTL
    role: HTL
    thickness: 200e-9
    eps_r: 3.0
    mu_n: 1e-10
    mu_p: 1e-6
    ni: 1e0
    N_D: 0.0
    N_A: 2e23
    chi: 2.05
    Eg: 3.05
    D_ion: 0.0
    P_lim: 1e30
    P0: 0.0
    tau_n: 1e-9
    tau_p: 1e-9
    n1: 1e0
    p1: 1e0
    B_rad: 1e-30
    C_n: 1e-42
    C_p: 1e-42
    alpha: 0.0
    optical_material: spiro_OMeTAD

  - name: SolarScale_absorber_template
    role: absorber
    thickness: 400e-9
    eps_r: 24.1
    mu_n: 2e-4
    mu_p: 2e-4
    ni: 3.2e13
    N_D: 0.0
    N_A: 0.0
    chi: 3.7
    Eg: 1.6
    D_ion: 1e-16
    P_lim: 1.6e27
    P0: 1.6e24
    tau_n: 1e-6
    tau_p: 1e-6
    n1: 3.2e13
    p1: 3.2e13
    B_rad: 5e-22
    C_n: 1e-42
    C_p: 1e-42
    alpha: 1.3e7
    optical_material: MAPbI3

  - name: TiO2_ETL
    role: ETL
    thickness: 100e-9
    eps_r: 10.0
    mu_n: 1e-5
    mu_p: 1e-10
    ni: 1e0
    N_D: 1e24
    N_A: 0.0
    chi: 4.0
    Eg: 3.2
    D_ion: 0.0
    P_lim: 1e30
    P0: 0.0
    tau_n: 1e-9
    tau_p: 1e-9
    n1: 1e0
    p1: 1e0
    B_rad: 1e-30
    C_n: 1e-42
    C_p: 1e-42
    alpha: 0.0
    optical_material: TiO2

# Dark c-Si p+/n junction used for the van Nijen et al. (2025) C-V cross-check.
# Published geometry, doping, and lifetime parameters are mapped directly; no
# SolarLab parameter is fitted to the external capacitance curve. Unspecified
# Si transport/recombination coefficients retain documented SolarLab values.
# The source is a 2-D Sentaurus model with partial-width contacts, whereas this
# config is a 1-D approximation. Its benchmark is therefore partial external
# evidence, not pointwise parity.

simulation_hints:
  min_N_grid: 400
  notes: >-
    The first 15 um is a computational subdomain containing the published
    Gaussian p+ emitter and the junction at 10 um. At the 15 um partition the
    Gaussian acceptor tail is only 1e-5 of the donor density; the remaining
    185 um is treated as the uniform n-type base. N=400/600/800 with equal
    interval budgets and interface-clustered tanh grids is the registered C-V
    convergence ladder.
    Use only the residual-certified QF frequency-domain solver for the
    registered benchmark. This does not certify the default J-V drivers.

electrical_grid:
  interval_weights:
    p_gaussian_emitter: 1.0
    n_base: 1.0
  alphas:
    p_gaussian_emitter: 1.0
    n_base: 3.0

device:
  mode: full
  T: 298.15
  # Contact-potential magnitude from the two published contact-face dopings
  # under SolarLab's non-degenerate Si convention; compute_V_bi() is positive
  # for this p-left/n-right orientation.
  V_bi: 0.8333674253259815
  Phi: 0.0
  interfaces:
    - [0.0, 0.0]

layers:
  - name: p_gaussian_emitter
    role: HTL
    thickness: 15.0e-6
    eps_r: 11.7
    mu_n: 0.135
    mu_p: 0.048
    ni: 1.0e16
    N_A: 1.0e25
    N_D: 1.0e21
    N_A_bulk: 0.0
    doping_profile_shape: gaussian
    # 5 um / sqrt(ln(10)): N_A(5 um)=0.1*N_A(0), N_A(10 um)=N_D.
    doping_decay_length: 3.295051144911304e-6
    doping_edge: front
    D_ion: 0.0
    P_lim: 1.0e30
    P0: 0.0
    tau_n: 1.0e-2
    tau_p: 1.0e-2
    n1: 1.0e16
    p1: 1.0e16
    B_rad: 1.0e-20
    C_n: 2.8e-43
    C_p: 9.9e-44
    alpha: 0.0
    chi: 4.05
    Eg: 1.12

  - name: n_base
    role: absorber
    thickness: 185.0e-6
    eps_r: 11.7
    mu_n: 0.135
    mu_p: 0.048
    ni: 1.0e16
    N_A: 0.0
    N_D: 1.0e21
    D_ion: 0.0
    P_lim: 1.0e30
    P0: 0.0
    tau_n: 1.0e-2
    tau_p: 1.0e-2
    n1: 1.0e16
    p1: 1.0e16
    B_rad: 1.0e-20
    C_n: 2.8e-43
    C_p: 9.9e-44
    alpha: 0.0
    chi: 4.05
    Eg: 1.12

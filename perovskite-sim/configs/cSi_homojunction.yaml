# Crystalline-Si p-n homojunction (simplified)
# n+ emitter / p-base.  D_ion = 0 everywhere (no mobile ions in Si).
# Reference: Sze & Ng, "Physics of Semiconductor Devices", 3rd ed.

simulation_hints:
  # The 180 um wafer is far outside the generic thin-film mesh envelope.
  # With the executable 1:4 allocation below, N_grid=100 places the first
  # p-base cell at ~72.2 nm, about 1.77 times the 40.9 nm carrier Debye
  # length, and is rejected before integration.
  # N_grid=200 is the declared production minimum and passes the necessary
  # interface-cell guard; that guard alone is not a default-driver J-V
  # mesh-convergence certificate.
  min_N_grid: 200
  notes: >-
    N_grid is the total electrical interval budget. The 1:4 emitter/base
    weights produce 40/160, 60/240, and 80/320 intervals on the 200/300/400
    ladder; alpha=2 in the 300 nm emitter avoids sub-angstrom cells while
    alpha=3 resolves the 180 um base interface. N_grid >= 200 passes the
    carrier-Debye interface guard. The opt-in QF regression certifies the
    complete registered J-V curve, Jsc, Voc, FF, and PCE on N=200/300/400.
    This does not certify the default transient or algebraic J-V drivers.

electrical_grid:
  interval_weights:
    n_emitter: 1.0
    p_base: 4.0
  alphas:
    n_emitter: 2.0
    p_base: 3.0

device:
  # Positive magnitude synchronized to abs(compute_V_bi()); the solver restores
  # the n-left junction polarity at the Poisson boundary.
  V_bi: 0.8928964399850017
  Phi: 2.7e21   # AM1.5G above Eg=1.12 eV
  interfaces:
    - [1.0e2, 1.0e2]   # n+/p junction: low SRV (bulk-limited Si)

layers:
  - name: n_emitter
    role: ETL
    thickness: 300e-9
    eps_r: 11.7
    mu_n: 0.135       # 1350 cm^2/Vs
    mu_p: 0.048       # 480 cm^2/Vs
    ni: 1.0e16        # Si at 300K
    N_D: 1e25         # n+ 1e19 cm^-3
    N_A: 0.0
    D_ion: 0.0
    P_lim: 1e30
    P0: 0.0
    tau_n: 1e-6       # degraded in n+ (heavy doping)
    tau_p: 1e-7
    n1: 1.0e16
    p1: 1.0e16
    B_rad: 1e-20
    C_n: 2.8e-43      # Auger Cn [m^6/s]
    C_p: 9.9e-44
    alpha: 1e6        # weak near front
    chi: 4.05
    Eg: 1.12

  - name: p_base
    role: absorber
    thickness: 180e-6   # 180 um wafer
    eps_r: 11.7
    mu_n: 0.135
    mu_p: 0.048
    ni: 1.0e16
    N_D: 0.0
    N_A: 1e22           # p 1e16 cm^-3
    D_ion: 0.0
    P_lim: 1e30
    P0: 0.0
    tau_n: 1e-3         # ms-scale minority lifetime
    tau_p: 1e-3
    n1: 1.0e16
    p1: 1.0e16
    B_rad: 1e-20
    C_n: 2.8e-43
    C_p: 9.9e-44
    alpha: 1e5          # avg absorption 1e3 cm^-1 (indirect)
    chi: 4.05
    Eg: 1.12

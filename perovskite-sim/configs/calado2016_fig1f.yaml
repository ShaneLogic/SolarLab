# Calado 2016 Fig 1f parameter anchor (bottom-cathode, contact SRH enabled).
#
# Source: Calado et al., Nat. Commun. 7, 13831 (2016), Supplementary Table 1
# and Supplementary Note 2 — the p-i-n toy model behind the simulated J-V of
# Fig 1f (HI = 1.84 at 40 mV/s in the paper's P_max,rev/P_max,fwd - 1 metric).
#
# This is an investigation baseline, not a completed paper reproduction.
# See docs/Calado2016ReproductionCheckpoint.md for current evidence.
# The parameters important for the ionic-hysteresis comparison are:
#   - D_ion here is the paper's own simulation value 2.585e-18 m^2/s
#     (mu_ion = 1e-12 cm^2/Vs, deliberately slowed by the authors to match
#     their ~40 s transients).
#   - Contacts share the absorber transport (mu = 20 cm^2/Vs everywhere,
#     identical flat bands) so minority carriers actually reach the
#     contact-volume SRH sink that generates the hysteresis.
#   - Contact SRH tau = 2e-15 s (paper value, "while unrealistic" — an
#     intentional near-perfect sink), traps at -0.2 eV (n-side) / -1.4 eV
#     (p-side) below the conduction band, expressed through n1/p1 with
#     N0 = 1e20 cm^-3 and ni = N0 exp(-Eg/2kT), Eg = 1.6 eV.
#
# Known deviations and unresolved comparisons:
#   - The paper drives a uniform G = 2.5e21 cm^-3 s^-1 in the i-layer; this
#     preset approximates it with weak Beer-Lambert absorption
#     (alpha*L = 0.04 => <= 4% front-to-back G variation, absorbed
#     photocurrent ~ 16 mA/cm^2). For the exact uniform profile pass
#     fixed_generation to run_jv_sweep.
#   - run_jv_sweep scans 0 -> V_max -> 0; the paper scans -1 -> +1.2 V with
#     an initial dark preparation. Experimental and simulated high-bias
#     holds must be distinguished; the simulation Methods specify that
#     reverse inherits the final forward state.
#   - This Legacy preset uses all-carrier Dirichlet outer contacts. The SI
#     instead blocks minority carriers; diagnostics select existing Full
#     mode with S_n_left=0 and S_p_right=0 to test those boundaries.
#   - With mixed contacts, uniform G, continuous 40 mV/s ramps, dark -1 V
#     preparation and a 3 s dark high-bias hold, diagnostic HI is 0.482
#     at N=100, versus extracted paper HI=1.839. N=60 gives 0.479.
#     This pair is not a full spatial/time/tolerance convergence certificate.

device:
  mode: legacy
  V_bi: 1.3
  Phi: 2.5e22
  interfaces:
    - [0.0, 0.0]
    - [0.0, 0.0]

layers:
  - name: p_contact
    role: HTL
    thickness: 200e-9
    eps_r: 20.0
    mu_n: 2e-3
    mu_p: 2e-3
    ni: 3.62e12
    N_D: 0.0
    N_A: 3e23
    D_ion: 0.0
    P_lim: 1e30
    P0: 0.0
    tau_n: 2e-15
    tau_p: 2e-15
    n1: 3.05e2      # N0 exp(-1.4 eV / kT): deep trap referenced to the CB
    p1: 4.36e22     # ni^2 / n1
    B_rad: 1e-16
    C_n: 0.0
    C_p: 0.0
    alpha: 0.0
    chi: 0.0
    Eg: 0.0

  - name: MAPbI3
    role: absorber
    thickness: 400e-9
    eps_r: 20.0
    mu_n: 2e-3
    mu_p: 2e-3
    ni: 3.62e12
    N_D: 0.0
    N_A: 0.0
    D_ion: 2.585e-18
    P_lim: 1e30
    P0: 1e25
    tau_n: 1.0      # no SRH in the perovskite in the paper's model
    tau_p: 1.0
    n1: 3.62e12
    p1: 3.62e12
    B_rad: 1e-16
    C_n: 0.0
    C_p: 0.0
    alpha: 1e5      # alpha*L = 0.04: quasi-uniform G, ~16 mA/cm^2 absorbed
    chi: 0.0
    Eg: 0.0

  - name: n_contact
    role: ETL
    thickness: 200e-9
    eps_r: 20.0
    mu_n: 2e-3
    mu_p: 2e-3
    ni: 3.62e12
    N_D: 3e23
    N_A: 0.0
    D_ion: 0.0
    P_lim: 1e30
    P0: 0.0
    tau_n: 2e-15
    tau_p: 2e-15
    n1: 4.36e22     # N0 exp(-0.2 eV / kT): shallow trap below the CB
    p1: 3.05e2      # ni^2 / n1
    B_rad: 1e-16
    C_n: 0.0
    C_p: 0.0
    alpha: 0.0
    chi: 0.0
    Eg: 0.0

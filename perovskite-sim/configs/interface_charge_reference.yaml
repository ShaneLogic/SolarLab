# Interface-charge Phase-3 reference, charge explicitly off.
#
# This is the uncalibrated physical companion of scaps_mirror_v2.yaml. It keeps
# the audited SCAPS layer and defect inventory but deliberately removes every
# device-level SCAPS matching lever: heterointerface recombination de-spiking,
# metal-contact carrier floors, and interface-state calibration factors. The
# contact-consistent semiconductor work-function boundary supplies the dark
# reference. Passing this config does not claim SCAPS parity.
device:
  built_in_potential_mode: semiconductor_work_function
  interface_charge_closure: "off"
  interface_charge_rebaseline_acknowledged: true
  dos_band_potentials: true
  Phi: 2.5e21
  mode: fast

layers:
  - name: glass
    role: substrate
    thickness_nm: 1.0e6
    E_g_eV: 9.0
    chi_eV: 1.0
    eps_r: 2.25
    mu_n_cm2: 0.0
    mu_p_cm2: 0.0
    N_C_cm3: 1.0e19
    N_V_cm3: 1.0e19
    N_D_cm3: 0.0
    N_A_cm3: 0.0
    v_th_cm_s: 1.0e7
    optical_material: glass
    incoherent: true

  - name: reference_HTL
    role: HTL
    thickness_nm: 20.0
    E_g_eV: 3.25
    chi_eV: 2.40
    eps_r: 11.75
    mu_n_cm2: 1.0e-3
    mu_p_cm2: 1.0e-3
    N_C_cm3: 2.5e20
    N_V_cm3: 2.5e20
    N_D_cm3: 0.0
    N_A_cm3: 1.0e18
    v_th_cm_s: 1.0e7
    optical_material: spiro_OMeTAD

  - name: reference_PVK
    role: absorber
    thickness_nm: 800.0
    E_g_eV: 1.53
    chi_eV: 3.94
    eps_r: 31.0
    mu_n_cm2: 20.0
    mu_p_cm2: 20.0
    N_C_cm3: 1.0e19
    N_V_cm3: 1.0e19
    N_D_cm3: 1.0e14
    N_A_cm3: 0.0
    v_th_cm_s: 1.0e7
    B_rad_cm3_s: 1.0e-12
    C_n_cm6_s: 2.3e-29
    C_p_cm6_s: 2.3e-29
    optical_material: MAPbI3
    bulk_defects:
      - name: Perovskite-CB
        sigma_n_cm2: 1.0e-15
        sigma_p_cm2: 1.0e-15
        N_t_cm3: 1.0e12
        E_t_eV_below_cb: 0.1
        distribution: single
      - name: Perovskite-VB
        sigma_n_cm2: 1.0e-15
        sigma_p_cm2: 1.0e-15
        N_t_cm3: 1.0e12
        E_t_eV_above_vb: 0.1
        distribution: single

  - name: reference_ETL
    role: ETL
    thickness_nm: 25.0
    E_g_eV: 1.9
    chi_eV: 4.10
    eps_r: 4.2
    mu_n_cm2: 1.0e-2
    mu_p_cm2: 1.0e-5
    N_C_cm3: 8.0e19
    N_V_cm3: 8.0e19
    N_D_cm3: 1.0e18
    N_A_cm3: 0.0
    v_th_cm_s: 1.0e7
    optical_material: TiO2

interfaces:
  - target: HTL/PVK
    sigma_n_cm2: 1.0e-19
    sigma_p_cm2: 1.0e-19
    N_t_cm2: 1.0e12
    v_th_cm_s: 1.0e7
    E_t_eV_below_cb: 0.6
    distribution: single

  - target: PVK/ETL
    sigma_n_cm2: 1.0e-19
    sigma_p_cm2: 1.0e-19
    N_t_cm2: 1.0e12
    v_th_cm_s: 1.0e7
    E_t_eV_below_cb: 0.6
    distribution: gaussian
    E_char_eV: 0.1
    N_peak_cm3: 5.64e8

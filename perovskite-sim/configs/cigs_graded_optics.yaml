# CIGS graded-transport + graded-optics research preset.
#
# This is an internal constitutive/numerical benchmark, not a calibrated cell.
# The CIGS absorber uses the Minoura et al. (2015) composition-dependent
# dielectric database and 25 optical slices, matching the slicing scale used
# by Carron et al. (2018).  GGI(x) consumes the same linear grading coordinate
# as electrical Eg(x)/chi(x); the GGI keys are its y=0/y=1 endpoints and CGI
# is held uniform at 0.90.
#
# Optical source domains:
#   Minoura: 0.7-6.5 eV n,k database and composition shift/average model.
#   Carron:  independent alpha(E,GGI,CGI) check through 2.5 eV, CGI > 0.75.
# The ZnO/CdS optical fallbacks remain nominal; this preset therefore supports
# an INTERNAL graded-absorber claim only, not external device validation.

simulation_hints:
  min_N_grid: 120
  notes: >-
    Research-only CIGS graded optical closure. Use for optical-slice and
    Kramers-Kronig refinement; do not use as a measured device calibration.

device:
  V_bi: 1.1546666460693205
  Phi: 2.5e21
  band_grading: true
  graded_optics: true
  S_n_right: 1.0e3
  interfaces:
    - [1.0e-1, 1.0e5]
    - [1.0e5, 1.0e-1]

layers:
  - name: ZnO_window
    role: ETL
    thickness: 200e-9
    eps_r: 9.0
    mu_n: 1.0e-2
    mu_p: 2.5e-3
    ni: 1e-3
    N_D: 1e24
    N_A: 0.0
    D_ion: 0.0
    P_lim: 1e30
    P0: 0.0
    tau_n: 1e-9
    tau_p: 1e-9
    n1: 1e0
    p1: 1e0
    B_rad: 0.0
    C_n: 0.0
    C_p: 0.0
    alpha: 0.0
    chi: 4.4
    Eg: 3.3

  - name: CdS_buffer
    role: buffer
    thickness: 50e-9
    eps_r: 10.0
    mu_n: 1.0e-2
    mu_p: 2.5e-3
    ni: 1e-3
    N_D: 1e22
    N_A: 0.0
    D_ion: 0.0
    P_lim: 1e30
    P0: 0.0
    tau_n: 1e-10
    tau_p: 1e-10
    n1: 1e0
    p1: 1e0
    B_rad: 0.0
    C_n: 0.0
    C_p: 0.0
    alpha: 1e6
    chi: 4.2
    Eg: 2.4

  - name: CIGS_absorber
    role: absorber
    thickness: 2.0e-6
    eps_r: 13.6
    mu_n: 1.0e-2
    mu_p: 2.5e-3
    ni: 7.3e9
    N_D: 0.0
    N_A: 1e22
    D_ion: 0.0
    P_lim: 1e30
    P0: 0.0
    tau_n: 1e-8
    tau_p: 1e-8
    n1: 7.3e9
    p1: 7.3e9
    B_rad: 1e-16
    C_n: 0.0
    C_p: 0.0
    alpha: 1e7
    chi: 4.2
    Eg: 1.15
    Eg_back: 1.40
    chi_back: 4.05
    grading_profile: linear
    grading_N_mult: 2
    cigs_graded_optics:
      model: minoura_2015
      ggi_front: 0.225
      ggi_back: 0.600
      cgi: 0.900
      slices: 25
      kk_quadrature_order: 192

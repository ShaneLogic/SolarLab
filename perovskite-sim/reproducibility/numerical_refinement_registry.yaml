schema_version: numerical-refinement-registry-v1
certificate_schema: numerical-certificate-v1
policy:
  terminal_pairs:
    grid: last two grids at the finest tolerance
    tolerance: last two tolerances at the finest grid
  incomplete_matrix_status: failed
  complete_nonconverged_status: partial
  complete_converged_status: certified
  threshold_change_policy: mint a new lane ID; never tune this record in place
  result_policy: write content-addressed outputs; never overwrite historical references

lanes:
  scaps-mirror-frozen-ion-ss:
    claim_level: internal-numerical-candidate
    config: configs/scaps_mirror.yaml
    config_sha256: 7ad4968d9c8249b76ca4e649d41c39e26727f6818cb81a15fe75f6b74b11b881
    executor: perovskite_sim.validation.refinement_executors:run_frozen_ion_steady_jv
    executor_version: v2
    grid:
      parameter: N_grid
      values: [30, 60, 90]
    tolerance:
      parameter: steady_residual_tolerance_factor
      factors: [1.0, 0.1, 0.01]
    observables:
      voc_V: {comparison: absolute_linf, limit: 0.001, units: V}
      jsc_A_m2: {comparison: relative_linf, limit: 0.002, units: A m-2}
      ff: {comparison: relative_linf, limit: 0.005, units: "1"}
      pce_percent: {comparison: relative_linf, limit: 0.005, units: "%"}
      jv_normalized: {comparison: absolute_linf, limit: 0.005, units: "1"}
    quality_gates:
      all_points_residual_converged: {operator: eq, limit: 1.0, units: "1"}
      max_residual_per_s: {operator: le, limit: 0.5, units: s-1}
      max_continuity_bound_A_m2: {operator: le, limit: 0.1, units: A m-2}
      max_current_spread_A_m2: {operator: le, limit: 0.01, units: A m-2}
      voc_bracketed: {operator: eq, limit: 1.0, units: "1"}
    options:
      config_loader: scaps
      require_protocol: true
      V_max_V: 1.5
      voltage_points: 31
      illuminated: true
      interface_states: false
      base_residual_tolerance_per_s: 1.0e-6
      base_log_step_tolerance: 1.0e-8
      base_stall_tolerance_per_s: 0.5
      max_continuity_current_error_A_m2: 0.1
    limitations:
      - This lane certifies internal frozen-ion carrier steady states, not SCAPS parity.
      - The initial transient is a Newton seed and is not itself a steady-state certificate.


      bulk_srh_denominator_positive: {operator: eq, limit: 1.0, units: "1"}
      diagnostics_complete: {operator: eq, limit: 1.0, units: "1"}
      interface_srh_denominator_positive: {operator: eq, limit: 1.0, units: "1"}
      jv_certified: {operator: eq, limit: 1.0, units: "1"}
      voc_bracketed: {operator: eq, limit: 1.0, units: "1"}
      max_positive_ion_inventory_relative_drift: {operator: le, limit: 1.0e-10, units: "1"}
      nonfinite_rhs_evaluations: {operator: eq, limit: 0.0, units: "1"}
      nonfinite_trial_evaluations: {operator: eq, limit: 0.0, units: "1"}
      terminal_densities_positive: {operator: eq, limit: 1.0, units: "1"}
      zero_floor_diagnostics_pass: {operator: eq, limit: 1.0, units: "1"}
    options:
      config_loader: standard
      require_protocol: true
      V_max_V: 1.5
      voltage_points: 20
      scan_rate_V_s: 5.0
      rtol: 1.0e-4
      carrier_atol_fraction: 1.0e-12
      ion_atol_fraction: 1.0e-12
      interface_atol_fraction: 1.0e-12
      minimum_atol: 1.0e-6
    limitations:
      - This lane certifies the registered local scan protocol, not the Courtier publication protocol.
      - Positive-ion inventory is available in snapshots; dual-ion inventory requires a future snapshot schema extension.


schema_version: 1
schemas:
  standard-device-v1:
    detector: standard_si_layers
    loader: perovskite_sim.models.config_loader.load_device_from_yaml
    units: SI
    required_top_keys: [device, layers]
    required_device_keys: []
    required_layer_keys:
      - name
      - role
      - thickness
      - eps_r
      - mu_n
      - mu_p
      - D_ion
      - P_lim
      - P0
      - ni
      - tau_n
      - tau_p
      - n1
      - p1
      - B_rad
      - C_n
      - C_p
      - alpha
      - N_A
      - N_D
    optional_layer_groups:
      bulk_carrier_statistics:
        selector: carrier_statistics
        default: maxwell_boltzmann
        supported_modes: [maxwell_boltzmann, fermi_dirac]
        fermi_dirac_required_keys: [Eg, Nc300, Nv300]
      dopant_ionization:
        selector: dopant_ionization_model
        default: fully_ionized
        supported_modes: [fully_ionized, discrete_level]
        discrete_level_required_material_keys: [Eg, Nc300, Nv300]
        donor_keys: [donor_binding_energy_eV, donor_degeneracy]
        acceptor_keys: [acceptor_binding_energy_eV, acceptor_degeneracy]
        binding_energy_units: eV
      spatial_doping_profile:
        activation_keys: [N_A_bulk, N_D_bulk]
        companion_keys:
          - doping_profile_shape
          - doping_decay_length
          - doping_edge
        supported_shapes: [gaussian]
        supported_edges: [front, back]
        density_units: m-3
        length_units: m
    unknown_key_policy: loader-permissive
  scaps-device-v1:
    detector: scaps_cgs_layers
    loader: perovskite_sim.scaps_compat.loader.load_scaps_yaml
    units: SCAPS-compatible cm/eV input converted to SI
    required_top_keys: [device, layers]
    required_device_keys: [Phi, mode]
    optional_device_groups:
      built_in_potential:
        selector: built_in_potential_mode
        supported_modes:
          - semiconductor_work_function
          - metal_work_function
          - legacy_manual
        compatibility_key: V_bi
    required_layer_keys:
      - name
      - role
      - thickness_nm
      - E_g_eV
      - chi_eV
      - eps_r
      - mu_n_cm2
      - mu_p_cm2
      - N_C_cm3
      - N_V_cm3
      - N_D_cm3
      - N_A_cm3
      - v_th_cm_s
    unknown_key_policy: strict-for-defect-records
  tandem-v1:
    detector: tandem_2T_monolithic
    loader: perovskite_sim.models.tandem_config.load_tandem_from_yaml
    units: mixed-explicit
    required_top_keys:
      - schema_version
      - device_type
      - tandem
    required_device_keys: []
    required_layer_keys: []
    unknown_key_policy: loader-permissive
  numerical-refinement-registry-v1:
    detector: schema_version_equals_numerical-refinement-registry-v1
    loader: perovskite_sim.validation.numerical_certificate.load_refinement_registry
    units: per-metric-explicit
    required_top_keys: [schema_version, certificate_schema, policy, lanes]
    required_device_keys: []
    required_layer_keys: []
    invariants:
      - every config is repository-relative and content-addressed by SHA-256
      - grid values are strictly increasing positive integers
      - tolerance factors are strictly decreasing positive values
      - observable and quality thresholds are declared before execution
      - changing a threshold requires a new lane ID
    unknown_key_policy: strict
  numerical-refinement-manifest-v1:
    detector: schema_version_equals_numerical-refinement-manifest-v1
    loader: perovskite_sim.validation.refinement_runner._read_json
    units: per-metric-explicit
    required_top_keys:
      - schema_version
      - run_id
      - lane_id
      - lane_definition_sha256
      - executor
      - executor_source_sha256
      - source
      - environment
      - expected_cells
      - artifacts
      - protocols
      - pending_cells
      - failed_cells
      - status
    required_device_keys: []
    required_layer_keys: []
    status_values: [running, complete, complete_with_failures]
    invariants:
      - every completed cell artifact path equals cells/<content_sha256>.json
      - canonical protocol documents and hashes are stored without threshold tuning
      - pending, failed, and complete state is recomputed during resume
    unknown_key_policy: strict
  numerical-certificate-v1:
    detector: schema_version_equals_numerical-certificate-v1
    loader: perovskite_sim.validation.numerical_certificate.NumericalCertificate.from_dict
    units: per-metric-explicit
    required_top_keys:
      - schema_version
      - certificate_sha256
      - run_id
      - lane_id
      - lane_definition_sha256
      - config_path
      - config_sha256
      - source_commit
      - source_fingerprint_sha256
      - environment
      - manifest_sha256
      - protocol_sha256
      - status
      - expected_cells
      - completed_cells
      - failed_cells
      - missing_cells
      - unconverged_dimensions
      - checks
      - cell_artifact_sha256
      - limitations
    required_device_keys: []
    required_layer_keys: []
    status_values: [certified, partial, failed]
    invariants:
      - failed means one or more required cells or fields are missing or failed
      - partial means the matrix completed but at least one pre-registered gate failed
      - certified means both terminal grid and tolerance pairs and every quality gate passed
      - certificate content is immutable and references an immutable manifest snapshot
    unknown_key_policy: strict

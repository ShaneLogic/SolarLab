    limitations:
      - the v1 N30/N60 matrix completes all four cells but remains partial because one pointwise sheet-charge grid difference is 1.4735 percent against a fixed 1 percent gate
      - the resolved-v2 N30/N60/N90 companion is internally certified at commit a3c6b30 with certificate SHA-256 f6e214307fe73fbc9d866d5e2537658cdb563134df78a419ecb6f4f873bd0844
      - the matrix is one-factor-at-a-time and does not certify Et/CBO/Nd/Nt interactions
      - Nd=5e15 and 1e16 cm-3 fail different tight-residual grid cells, while 1e17 and 1e18 cm-3 remain outside the local-QSS basin
      - N120 at factor 0.5 fails closed for the Nd=2e15 cm-3 dark-bias target and is outside the current solver basin

    configs:
      - configs/nip_SnPb_1p22.yaml
      - configs/nip_wideGap_FACs_1p77.yaml
      - configs/tandem_lin2019.yaml
    protocol:
      local:
        optics: combined TMM
        wavelength_range_nm: [300, 1100]
        wavelength_points: 220
        N_grid: 40
        n_points: 25
      source:
        champion_device_area_cm2: 0.073
        certified_aperture_area_cm2: 0.049
        provenance: >-
          Lin 2019 Table 2 reverse-scan champion tuple is reported for the
          0.073 cm2 device; 0.049 cm2 is the separately certified aperture.
        supplementary_evidence: >-
          Supplementary Table 3 reports Jsc=14.2-15.6 mA/cm2 across 26 tandem
          devices and the 15.6 mA/cm2 champion central value. Supplementary
          Figure 22 independently reports 15.77/15.90 mA/cm2 reverse/forward

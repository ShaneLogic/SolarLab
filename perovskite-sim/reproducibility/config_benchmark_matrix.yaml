  courtier2019-ionmonger:
    kind: external
    status: pass
    claim_level: calibrated_reproduction
    evidence_tier: calibration_only
    source_url: https://doi.org/10.1039/C8EE01576G
    source_solver:
      repository_url: https://github.com/PerovskiteSCModelling/IonMonger
      exact_version_frozen: false
      limitation: the exact publication-era commit and MATLAB output are not stored locally
    command: >-
      pytest -q -m validation
      tests/validation/test_paper_configurations.py::test_ionmonger_repro_matches_paper_metrics
    tests: [tests/validation/test_paper_configurations.py]
    node_ids:
      - tests/validation/test_paper_configurations.py::test_ionmonger_repro_matches_paper_metrics
    configs: [configs/ionmonger_courtier2019_repro.yaml]
    protocol:
      local:
        N_grid: 60
        n_points: 20
        v_rate_V_s: 5.0
        V_max_V: 1.5
        preconditioning: solver dark-equilibrium initial state
      source:
        representative_v_rate_V_s: 0.075
        preconditioning: 1.2 V for 40 s
        provenance: Courtier 2019 representative J-V protocol
    calibration:
      parameters: {device.V_bi: 0.98}
      targets: [Voc_V]
    non_calibration_checks: [Jsc_A_m2, FF, absorbed_photon_budget]
    observed_reverse:
      Voc_V: 1.073879325
      Jsc_A_m2: 222.778140
      FF: 0.753781846
      PCE_percent: 18.033239
    regression_tolerance:
      Voc_V: 0.005
      Jsc_A_m2: 1.0
      FF: 0.01
      PCE_percent: 0.5
    limitations:
      - V_bi=0.98 V is calibrated against the reported Voc
      - the automated scan rate is about 67 times the representative 0.075 V/s paper protocol
      - the paper preconditioning protocol is not reproduced
      - no digitized source curve or extraction uncertainty is stored in the repository
  ionmonger-physical-regression:
    kind: internal
    status: pass
    claim_level: paper-informed-physical-regression
    command: >-
      pytest -q -m validation tests/validation/test_paper_configurations.py

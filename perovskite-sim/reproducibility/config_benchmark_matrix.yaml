    supplementary_url: https://static-content.springer.com/esm/art%3A10.1038%2Fs41560-019-0466-3/MediaObjects/41560_2019_466_MOESM1_ESM.pdf
    command: pytest -q -m 'slow or not slow' tests/integration/test_tandem_lin2019.py

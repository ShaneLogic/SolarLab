name: Refactor checks

on:
  push:
    branches: [devel]
  pull_request:
    branches: [main, devel]
  workflow_dispatch:
    inputs:
      run_coverage:
        description: Run coverage on the bounded core smoke selection
        type: boolean
        default: false
      run_slow:
        description: Run the existing dark p-n junction regression only
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: refactor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: perovskite-sim

env:
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv-refactor
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.13"
          python-version: "3.13.15"
      - run: uv lock --check
      - run: uv sync --frozen --extra dev
      # Scope grows with the refactor. Do not reformat the legacy numerical tree.
      - name: Lint new files and the touched shared fixture
        run: >-
          uv run --frozen --no-sync ruff check --config pyproject.toml
          tests/conftest.py tests/unit/test_pytest_isolation.py
          tests/unit/backend/conftest.py tests/integration/backend/conftest.py
          ../scripts/benchmarks/probe_ida_binding.py
          ../scripts/benchmarks/g2_route_launcher.py ../tests/numerical_contracts/test_g2_route_launcher.py
      - name: Format check for new files
        run: >-
          uv run --frozen --no-sync ruff format --check --config pyproject.toml
          tests/unit/test_pytest_isolation.py tests/unit/backend/conftest.py
          tests/integration/backend/conftest.py ../scripts/benchmarks/probe_ida_binding.py
      - name: Type check new files
        run: >-
          uv run --frozen --no-sync mypy
          tests/unit/test_pytest_isolation.py tests/unit/backend/conftest.py
          tests/integration/backend/conftest.py ../scripts/benchmarks/probe_ida_binding.py

  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11.16", "3.13.15"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.13"
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra dev
      - name: Core imports, negative inputs and independent arithmetic oracles
        run: >-
          uv run --frozen --no-sync python -m pytest -q -p no:cacheprovider
          tests/unit/test_pytest_isolation.py::test_core_pytest_does_not_import_backend
          tests/unit/test_blas_marker_selection.py
          tests/unit/physics/test_dynamic_storage.py
          tests/unit/discretization/test_fe_operators.py
      - name: Public contracts, precision, storage and sparse support
        working-directory: .
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        # Native IDA qualification campaigns retain their own setting-specific
        # pass/fail records; these commands only cover the named slices.
        run: |
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q -p no:cacheprovider tests/numerical_contracts/test_contracts.py tests/numerical_contracts/test_precision.py tests/numerical_contracts/test_primitive_difference.py
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q -p no:cacheprovider tests/numerical_contracts/test_storage.py -k 'not test_nc01_ida_all_native_intervals'
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q -p no:cacheprovider tests/numerical_contracts/test_sparse.py
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q -p no:cacheprovider tests/numerical_contracts/test_public_interface.py tests/numerical_contracts/test_state_authority.py
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q -p no:cacheprovider tests/numerical_contracts/test_temporal_interface.py tests/numerical_contracts/test_trial_interface.py
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q -p no:cacheprovider tests/numerical_contracts/test_linear_forms.py
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q -p no:cacheprovider tests/numerical_contracts/test_conservative_device.py
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q -p no:cacheprovider tests/numerical_contracts/test_band_steps.py
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q -p no:cacheprovider tests/numerical_contracts/test_framed_time_derivative.py -m 'not slow'
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q -p no:cacheprovider tests/numerical_contracts/test_segment_startup.py
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q -p no:cacheprovider tests/numerical_contracts/test_native_history.py tests/numerical_contracts/test_native_runner.py tests/numerical_contracts/test_runtime_timing.py
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q -p no:cacheprovider tests/numerical_contracts/test_execution_wall.py
          # Outer G2 supervisor: synthetic process groups only, no native solver.
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q -p no:cacheprovider tests/numerical_contracts/test_g2_route_launcher.py
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q -p no:cacheprovider tests/numerical_contracts/test_error_weights.py::TestInitialWeightSource::test_pins_and_real_callback_route
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q -p no:cacheprovider tests/numerical_contracts/test_native_readback.py tests/numerical_contracts/test_qualification_bridge.py
          # G2-R latched producer/refresh/reader slice and metadata-only route checks.
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q -p no:cacheprovider tests/numerical_contracts/test_reference_refresh.py tests/numerical_contracts/test_g2_route.py tests/numerical_contracts/test_g2_route_bindings.py
          # Offline T1 evaluation, comparison and reference-error algebra (python-flint cases skip here).
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q -p no:cacheprovider tests/numerical_contracts/test_t1_gate.py tests/numerical_contracts/test_g2_compare.py tests/numerical_contracts/test_g2_reference_error.py
          # BE reference driver; its real Accelerate probe is skipped off macOS.
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q -p no:cacheprovider tests/numerical_contracts/test_g2_reference_be.py
          # Repository-only comparison arithmetic; prepared campaign IO has separate evidence.
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q -p no:cacheprovider tests/numerical_contracts/test_qualification_comparison.py::ArithmeticTests
          REAL_DEVICE_PLAN=/dev/null "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q -p no:cacheprovider tests/numerical_contracts/test_native_transfer.py
          # This selection uses synthetic packets only and reads no device plan.
          REAL_DEVICE_PLAN=/dev/null "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q -p no:cacheprovider tests/numerical_contracts/test_native_observation.py -k 'charge_refinement or partial_charge_observation or packet_extended_size_requires_matching_qualification_policy'
          REAL_DEVICE_PLAN=/dev/null "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q -p no:cacheprovider tests/numerical_contracts/test_interval_observation.py -k 'contained_observation_range or fixed4'
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q -p no:cacheprovider tests/numerical_contracts/test_device.py
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q -p no:cacheprovider tests/numerical_contracts/test_ports.py -k 'not test_rc_ida_trajectory_and_every_native_interval'
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q -p no:cacheprovider tests/refactor/test_hysteresis_current_bounds.py tests/refactor/test_hysteresis_mobile_bounds.py
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q -p no:cacheprovider tests/refactor/test_scaps_reference.py
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m unittest discover -s tests/refactor -p test_reference_map.py
      - name: P04-A route-independent kernels (M/N parity and analytic checks)
        working-directory: .
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          # The core environment is the legacy perovskite-sim project; the new
          # solarlab packages are imported from the checkout source tree.
          PYTHONPATH: src
        run: >-
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q -p no:cacheprovider
          tests/unit/contracts tests/unit/mesh tests/unit/discretization
          tests/unit/physics/electrostatics tests/unit/physics/statistics
          tests/unit/physics/contacts tests/unit/physics/transport tests/unit/physics/ions
          tests/unit/physics/band_structure tests/unit/physics/field_mobility tests/independent/p04
          --deselect tests/independent/p04/test_p04_legacy_golden.py::test_legacy_reproduces_golden_bitwise
          --deselect tests/independent/p04/test_p04_legacy_golden.py::test_candidate_against_golden
      # The recorded legacy golden is bitwise for its macOS/Accelerate capture
      # host only (libm differs on Linux); live legacy-vs-new parity runs here.

  packages:
    runs-on: ubuntu-24.04
    # Package/refactor checks run about 8 min plus 1.5 min runtime pools.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11.16", "3.13.15"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The release-bundle test compares the build commit with HEAD^.
          fetch-depth: 2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.13"
          python-version: ${{ matrix.python }}
      - run: uv lock --check
      - run: uv sync --frozen --extra dev --extra server --no-editable
      - name: New-core DC and research workflow
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
        run: >-
          uv run --frozen --no-sync python -m pytest -q -p no:cacheprovider
          tests/unit/solvers/test_nonlinear_analytic.py
          tests/unit/solvers/test_balance_convergence.py
          tests/unit/solvers/test_frequency_domain.py
          tests/integration/test_impedance_1d.py
          tests/integration/test_impedance_finite_contacts.py
          tests/integration/test_impedance_selective_contacts.py
          tests/integration/test_transient_1d.py
          tests/integration/test_transient_voltage_1d.py
          tests/integration/test_transient_results.py
          tests/runtime/test_transient_worker.py
          tests/runtime/test_transient_job_service.py
          tests/integration/test_ionic_1d.py
          tests/integration/test_ionic_multilayer_1d.py
          tests/integration/test_ionic_steady_1d.py
          tests/integration/test_ionic_backward_euler_1d.py
          tests/integration/test_ionic_transient_1d.py
          tests/integration/test_dual_ionic_1d.py
          tests/integration/test_dual_ionic_solvers_1d.py
          tests/integration/test_shared_site_ionic_1d.py
          tests/integration/test_shared_site_ionic_solvers_1d.py
          tests/integration/test_ionic_small_signal_1d.py
          tests/integration/test_ionic_impedance_1d.py
          tests/integration/test_immobile_ions_1d.py
          tests/integration/test_ionic_steady_jv_1d.py
          tests/integration/test_ionic_initialization_1d.py
          tests/integration/test_ionic_pv_1d.py
          tests/integration/test_multiple_ionic_domains_1d.py
          tests/integration/test_multiple_ionic_steady_1d.py
          tests/integration/test_multiple_ionic_transient_1d.py
          tests/integration/test_neutral_defects_1d.py
          tests/integration/test_field_transport_1d.py
          tests/integration/test_field_transport_ac_guards.py
          tests/runtime/test_ionic_transient_worker.py
          tests/runtime/test_ionic_jv_worker.py
          tests/runtime/test_ionic_jv_job_service.py
          tests/runtime/test_ionic_transient_job_service.py
          tests/unit/experiments/test_steady_jv_metrics.py
          tests/unit/experiments/test_operating_points.py
          tests/integration/test_core_1d.py
          tests/integration/test_research_1d_workflow.py
      - name: Package boundaries and dependency continuity
        run: >-
          uv run --frozen --no-sync python -m pytest -q -p no:cacheprovider
          tests/refactor/test_package_preparation.py
          tests/refactor/test_package_boundaries.py
          tests/refactor/test_configuration_preparation.py
          tests/refactor/test_registry_preparation.py
          tests/refactor/test_device_configuration_preparation.py
          tests/refactor/test_complex_configuration_preparation.py
          tests/refactor/test_structured_registry_preparation.py
          tests/refactor/test_execution_identity_preparation.py
          tests/refactor/test_behavior_context.py
          tests/refactor/test_experiment_registry_startup.py
          tests/refactor/test_input_domain_closure.py
          tests/refactor/test_legacy_behavior_execution.py
          tests/refactor/test_legacy_execution_context.py
          tests/refactor/test_effective_behavior_identity.py
          tests/refactor/test_configuration_migration.py
          tests/refactor/test_execution_manifest.py
          tests/refactor/test_release_bundle.py
          tests/refactor/test_binding_identity.py
          tests/refactor/test_registry_mapping.py
          tests/refactor/test_configuration_schema_export.py
          tests/refactor/test_configuration_input_types.py::test_json_mode_matches_public_metadata_and_preserves_default
      # Separate process: the pool budgets include the parent process family RSS.
      - name: Runtime store, execution pool and services
        run: >-
          uv run --frozen --no-sync python -m pytest -q -p no:cacheprovider
          tests/runtime/test_run_store.py
          tests/runtime/test_execution.py
          tests/runtime/test_steady_jv_worker.py
          tests/runtime/test_steady_sweep_worker.py
          tests/runtime/test_steady_job_routes.py
          tests/runtime/test_legacy_engine.py
          tests/runtime/test_event_service.py
          tests/runtime/test_configuration_schema_service.py
      - name: Check typed configuration, registry and runtime preparation
        run: |
          uv run --frozen --no-sync ruff check --no-cache src scripts/generate_configuration_schema.py tests/refactor/test_configuration_schema_export.py tests/refactor/test_configuration_input_types.py tests/refactor/test_configuration_preparation.py tests/refactor/test_registry_preparation.py tests/refactor/test_device_configuration_preparation.py tests/refactor/test_complex_configuration_preparation.py tests/refactor/test_structured_registry_preparation.py tests/refactor/test_execution_identity_preparation.py tests/refactor/test_behavior_context.py tests/refactor/test_experiment_registry_startup.py tests/refactor/test_input_domain_closure.py tests/refactor/test_legacy_behavior_execution.py tests/refactor/test_legacy_execution_context.py tests/refactor/legacy_driver_observer.py tests/refactor/test_effective_behavior_identity.py tests/refactor/test_configuration_migration.py tests/refactor/test_execution_manifest.py tests/refactor/test_release_bundle.py tests/refactor/test_binding_identity.py tests/refactor/test_registry_mapping.py tests/runtime/test_run_store.py tests/runtime/test_execution.py tests/runtime/test_legacy_engine.py tests/runtime/legacy_fixtures.py tests/runtime/execution_workers.py tests/runtime/test_event_service.py tests/runtime/test_configuration_schema_service.py tests/runtime/test_configuration_preview.py tests/unit/contracts tests/unit/mesh tests/unit/discretization tests/unit/physics/electrostatics tests/unit/physics/statistics tests/unit/physics/contacts tests/unit/physics/transport tests/unit/physics/band_structure tests/unit/physics/field_mobility
          uv run --frozen --no-sync mypy --cache-dir /dev/null src/solarlab src/solarlab_server
      - name: Check generated configuration schema
        run: uv run --frozen --no-sync python scripts/generate_configuration_schema.py --check
      - name: Installed package imports and resources outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$UV_PROJECT_ENVIRONMENT/bin/python" -I -B - <<'PY'
          import importlib.metadata
          import importlib.resources
          import pathlib
          import sys
          import solarlab
          import solarlab_research
          import solarlab_server
          from solarlab.config import behavior
          from solarlab_server.app import create_app
          from perovskite_sim.models.parameters import MaterialParams

          prefix = pathlib.Path(sys.prefix).resolve()
          for module in (solarlab, solarlab_research, solarlab_server):
              assert pathlib.Path(module.__file__).resolve().is_relative_to(prefix)
              assert importlib.resources.files(module).joinpath("py.typed").is_file()
          assert MaterialParams.__module__ == "perovskite_sim.models.parameters"
          assert create_app.__module__ == "solarlab_server.app"
          assert pathlib.Path(behavior.__file__).resolve().is_relative_to(prefix)
          assert importlib.metadata.version("solarlab") == "0.1.0"
          PY

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11.16", "3.13.15"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.13"
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra dev --extra server
      - name: Job cleanup, mocked dispatch and API rejection paths
        run: >-
          uv run --frozen --no-sync python -m pytest -q -p no:cacheprovider
          tests/unit/test_pytest_isolation.py::test_backend_cleanup_precedes_monkeypatch_undo
          tests/unit/backend/test_jobs.py tests/unit/backend/test_progress.py
          tests/unit/backend/test_twod_microstructure_preflight.py
          tests/unit/backend/test_experiment_protocol_api.py
          tests/integration/backend/test_twod_configs_api.py

  binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.13"
          python-version: "3.13.15"
      - run: uv sync --frozen --all-extras
      - name: Optional research, notebook and legacy queue imports
        run: >-
          uv run --frozen --no-sync python -c
          "import openpyxl, fitz, jupyterlab, backend.celery_app"
      - name: Tiny analytic IDA binding probes
        run: >-
          uv run --frozen --no-sync python ../scripts/benchmarks/probe_ida_binding.py
          --output "$RUNNER_TEMP/BindingCapabilitiesV1.json"

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.13"
          python-version: "3.13.15"
      - name: Install locked Python schema and service dependencies
        working-directory: .
        run: uv sync --frozen --extra dev --extra server --no-editable
      - name: Verify generated input types and compile-time contracts
        working-directory: .
        run: >-
          uv run --frozen --no-sync python -m pytest -q -p no:cacheprovider
          --confcutdir=tests/refactor -o addopts=
          tests/refactor/test_configuration_input_types.py
      - name: Stored-run and configuration clients with a real loopback service
        working-directory: .
        run: >-
          uv run --frozen --no-sync python -m pytest -q -p no:cacheprovider
          --confcutdir=tests/runtime -o addopts=
          tests/runtime/test_run_client_contract.py
          tests/runtime/test_configuration_preview.py
          tests/runtime/test_legacy_wire_preview.py
      - run: SOLARLAB_PYTHON="$UV_PROJECT_ENVIRONMENT/bin/python" npm run test:run
      - run: npm run build

  coverage:
    if: github.event_name == 'workflow_dispatch' && inputs.run_coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.13"
          python-version: "3.13.15"
      - run: uv sync --frozen --extra dev
      # Coverage stays outside the default pytest addopts and numerical lanes.
      - run: >-
          uv run --frozen --no-sync python -m pytest -q
          --cov=perovskite_sim.physics.dynamic_storage
          --cov=perovskite_sim.discretization.fe_operators --cov-report=term-missing
          tests/unit/physics/test_dynamic_storage.py
          tests/unit/discretization/test_fe_operators.py

  slow:
    if: github.event_name == 'workflow_dispatch' && inputs.run_slow
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.13"
          python-version: "3.13.15"
      - run: uv sync --frozen --extra dev
      # One bounded existing regression. Full slow suites and qualified
      # SCAPS/HI/R1 long-window campaigns require separately scheduled runs.
      - run: >-
          uv run --frozen --no-sync python -m pytest -q -m slow
          tests/regression/test_pn_junction_analytic.py

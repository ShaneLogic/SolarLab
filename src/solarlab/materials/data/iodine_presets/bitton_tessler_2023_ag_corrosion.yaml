schema_version: solarlab.iodine-deck.v1
id: bitton_tessler_2023_ag_corrosion
name: Bitton & Tessler (2023) HBL Ag Cathode Corrosion
description: >-
  Open-boundary full-stack deck with Faradaic metal corrosion at the left HBL
  cathode (Ag + I- -> AgI + e-_metal, v_corr = 1e-5 m/s) resolving the ~2 s
  transport breakthrough lag and steady corrosion flux under forward bias.
reference: Bitton & Tessler, Energy Environ. Sci. 16, 2621-2628 (2023), Fig. 5a & Inset

electronic_stack:
  allow_legacy_benchmark_deck: true
  intervals_per_layer: [14, 36, 14]
  device:
    schema_version: solarlab.device-preparation.v1
    id: bt2023_ag_corrosion_stack
    name: Bitton & Tessler 2023 Ag Corrosion Stack
    source_format: canonical
    settings:
      built_in_potential_mode: metal_work_function
      V_bi: 0.0
      work_function_left_eV: 4.44
      work_function_right_eV: 5.76
      flat_band_metal_contacts: true
      contact_phi_B_eV: 0.14
      dos_band_potentials: true
      T: 300.0
      Phi: 1.623603893899371e24
    layers:
      - id: hbl
        name: HBL
        role: ETL
        thickness: 50.0e-9
        parameters:
          chi: 4.3
          Eg: 2.5
          Nc300: 1.0e27
          Nv300: 1.0e27
          eps_r: 3.0
          N_D: 1.0
          N_A: 0.0
          ni: 1002130.379122778
          n1: 1002130.379122778
          p1: 1002130.379122778
          tau_n: 1.0e6
          tau_p: 1.0e6
          B_rad: 1.206341838923508e-15
          C_n: 0.0
          C_p: 0.0
          mu_n: 1.0e-7
          mu_p: 1.0e-7
          alpha: 0.0
          A_star_n: 0.0
          A_star_p: 0.0
          D_ion: 0.0
          P0: 0.0
          P_lim: 1.0e28
      - id: absorber
        name: Perovskite
        role: absorber
        thickness: 500.0e-9
        parameters:
          chi: 4.3
          Eg: 1.6
          Nc300: 7.0e24
          Nv300: 2.5e24
          eps_r: 50.0
          N_D: 0.0
          N_A: 0.0
          ni: 152093456592.39743
          n1: 152093456592.39743
          p1: 152093456592.39743
          tau_n: 1.0e6
          tau_p: 1.0e6
          B_rad: 1.0e-16
          C_n: 0.0
          C_p: 0.0
          mu_n: 2.0e-4
          mu_p: 2.0e-4
          alpha: 2000.0
          A_star_n: 0.0
          A_star_p: 0.0
          D_ion: 0.0
          P0: 0.0
          P_lim: 1.0e28
      - id: ebl
        name: EBL
        role: HTL
        thickness: 50.0e-9
        parameters:
          chi: 3.4
          Eg: 2.5
          Nc300: 1.0e27
          Nv300: 1.0e27
          eps_r: 3.0
          N_D: 0.0
          N_A: 1.0
          ni: 1002130.379122778
          n1: 1002130.379122778
          p1: 1002130.379122778
          tau_n: 1.0e6
          tau_p: 1.0e6
          B_rad: 1.206341838923508e-15
          C_n: 0.0
          C_p: 0.0
          mu_n: 1.0e-7
          mu_p: 1.0e-7
          alpha: 0.0
          A_star_n: 0.0
          A_star_p: 0.0
          D_ion: 0.0
          P0: 0.0
          P_lim: 1.0e28

chemistry:
  domain_mode: full_stack_permeable
  thermodynamic_mode: wegscheider_detailed_balance
  reaction_e_order: bimolecular_n
  initialize_equilibrium_split: false
  enforce_spatial_wegscheider: true
  left_boundary:
    contact_reaction_mode: metal_faradaic_corrosion
    contact_corrosion_velocity_m_s: 1.0e-5
  layers:
    - layer_id: hbl
      units: cgs
      D_minus: 1.0e-8
      D_atom: 1.0e-8
      D_mol: 1.0e-8
      initial_iodide: 0.0
      rate_mode: smoluchowski_capture_radius
      capture_radius_nm: 0.2
      k_b: 1.0e-6
      K_diss: 1.0e8
      n_e_star: 1.0e8
    - layer_id: absorber
      units: cgs
      D_minus: 1.0e-9
      D_atom: 1.0e-9
      D_mol: 1.0e-9
      initial_iodide: 1.0e18
      rate_mode: explicit_rates
      k_a: 1.0e-11
      k_b: 1.0e-3
      k_c: 5.0e-11
      k_d: 3.0e-16
      k_e: 3.0e-16
      K_diss: 1.0e8
      n_e_star: 1.0e8
    - layer_id: ebl
      units: cgs
      D_minus: 1.0e-8
      D_atom: 1.0e-8
      D_mol: 1.0e-8
      initial_iodide: 0.0
      rate_mode: smoluchowski_capture_radius
      capture_radius_nm: 0.2
      k_b: 1.0e-6
      K_diss: 1.0e8
      n_e_star: 1.0e8

steady:
  voltage_V: 0.9
  generation_scale: 1.0
  compute_frozen_jv: false
  jv_v_min_V: 0.0
  jv_v_max_V: 1.25
  jv_n_points: 26

impedance:
  voltage_V: 0.9
  generation_scale: 1.0
  f_min_Hz: 1.0e-2
  f_max_Hz: 1.0e6
  n_frequencies: 25
  chem_mode: mobile

aging:
  stages:
    - name: ag_cathode_breakthrough
      duration_s: 40.0
      voltage_V: 0.9
      generation_scale: 1.0
      max_step_s: 2.0
    - name: ag_cathode_steady_corrosion
      duration_s: 80.0
      voltage_V: 0.9
      generation_scale: 1.0
      max_step_s: 10.0
  checkpoint_times_s: [0.0, 2.0, 10.0, 40.0, 120.0]
  probe:
    mode: none
    v_min_V: 0.0
    v_max_V: 1.25
    n_points: 26
    scan_rate_V_s: 1.0
    generation_scale: 1.0
    incident_power_W_m2: 1000.0

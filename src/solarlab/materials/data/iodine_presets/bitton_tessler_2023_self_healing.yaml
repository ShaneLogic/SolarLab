schema_version: solarlab.iodine-deck.v1
id: bitton_tessler_2023_self_healing
name: Bitton & Tessler (2023) Light Stress & Dark Self-Healing
description: >-
  Two-stage closed-system protocol combining 1 Sun / 0.9 V forward-bias light
  stress (oxidizing I- into neutral I0/I2 recombination centers) followed by
  dark 0 V resting recovery demonstrating reversible PV metric self-healing.
reference: Bitton & Tessler, Energy Environ. Sci. 16, 2621-2628 (2023), Table 1 & Fig. S2c

electronic_stack:
  allow_legacy_benchmark_deck: true
  intervals_per_layer: [14, 36, 14]
  device:
    schema_version: solarlab.device-preparation.v1
    id: bt2023_self_healing_stack
    name: Bitton & Tessler 2023 Self-Healing Stack
    source_format: canonical
    settings:
      built_in_potential_mode: metal_work_function
      V_bi: 0.0
      work_function_left_eV: 4.44
      work_function_right_eV: 5.76
      flat_band_metal_contacts: true
      contact_phi_B_eV: 0.14
      dos_band_potentials: true
      T: 300.0
      Phi: 1.623603893899371e24
    layers:
      - id: hbl
        name: HBL
        role: ETL
        thickness: 50.0e-9
        parameters:
          chi: 4.3
          Eg: 2.5
          Nc300: 1.0e27
          Nv300: 1.0e27
          eps_r: 3.0
          N_D: 1.0
          N_A: 0.0
          ni: 1002130.379122778
          n1: 1002130.379122778
          p1: 1002130.379122778
          tau_n: 1.0e6
          tau_p: 1.0e6
          B_rad: 1.206341838923508e-15
          C_n: 0.0
          C_p: 0.0
          mu_n: 1.0e-7
          mu_p: 1.0e-7
          alpha: 0.0
          A_star_n: 0.0
          A_star_p: 0.0
          D_ion: 0.0
          P0: 0.0
          P_lim: 1.0e28
      - id: absorber
        name: Perovskite
        role: absorber
        thickness: 500.0e-9
        parameters:
          chi: 4.3
          Eg: 1.6
          Nc300: 7.0e24
          Nv300: 2.5e24
          eps_r: 50.0
          N_D: 0.0
          N_A: 0.0
          ni: 152093456592.39743
          n1: 152093456592.39743
          p1: 152093456592.39743
          tau_n: 1.0e6
          tau_p: 1.0e6
          B_rad: 1.0e-16
          C_n: 0.0
          C_p: 0.0
          mu_n: 2.0e-4
          mu_p: 2.0e-4
          alpha: 2000.0
          A_star_n: 0.0
          A_star_p: 0.0
          D_ion: 0.0
          P0: 0.0
          P_lim: 1.0e28
      - id: ebl
        name: EBL
        role: HTL
        thickness: 50.0e-9
        parameters:
          chi: 3.4
          Eg: 2.5
          Nc300: 1.0e27
          Nv300: 1.0e27
          eps_r: 3.0
          N_D: 0.0
          N_A: 1.0
          ni: 1002130.379122778
          n1: 1002130.379122778
          p1: 1002130.379122778
          tau_n: 1.0e6
          tau_p: 1.0e6
          B_rad: 1.206341838923508e-15
          C_n: 0.0
          C_p: 0.0
          mu_n: 1.0e-7
          mu_p: 1.0e-7
          alpha: 0.0
          A_star_n: 0.0
          A_star_p: 0.0
          D_ion: 0.0
          P0: 0.0
          P_lim: 1.0e28

chemistry:
  domain_mode: absorber_blocking
  thermodynamic_mode: wegscheider_detailed_balance
  reaction_e_order: bimolecular_n
  initialize_equilibrium_split: false
  enforce_spatial_wegscheider: true
  layers:
    - layer_id: absorber
      units: cgs
      D_minus: 1.0e-9
      D_atom: 1.0e-9
      D_mol: 1.0e-9
      initial_iodide: 1.0e18
      rate_mode: explicit_rates
      k_a: 1.0e-11
      k_b: 1.0e-3
      k_c: 5.0e-11
      k_d: 3.0e-16
      k_e: 3.0e-16
      K_diss: 1.0e8
      n_e_star: 1.0e8

steady:
  voltage_V: 0.9
  generation_scale: 1.0
  compute_frozen_jv: true
  jv_v_min_V: 0.0
  jv_v_max_V: 1.25
  jv_n_points: 26

impedance:
  voltage_V: 0.9
  generation_scale: 1.0
  f_min_Hz: 1.0e-2
  f_max_Hz: 1.0e6
  n_frequencies: 25
  chem_mode: both

aging:
  stages:
    - name: light_stress_0p9V
      duration_s: 300.0
      voltage_V: 0.9
      generation_scale: 1.0
      max_step_s: 50.0
    - name: dark_self_healing_0V
      duration_s: 1800.0
      voltage_V: 0.0
      generation_scale: 0.0
      max_step_s: 200.0
  checkpoint_times_s: [0.0, 300.0, 900.0, 2100.0]
  probe:
    mode: frozen_chemistry_jv
    v_min_V: 0.0
    v_max_V: 1.25
    n_points: 26
    scan_rate_V_s: 1.0
    generation_scale: 1.0
    incident_power_W_m2: 1000.0
